{% extends "layout.html" %}

{% block content %}

  {% include "archive_ui.html" %}

  <form action="/contacts" method="get" class="tool-bar">
    <label for="search">Search Term</label>
    <input id="search" type="search" name="q"
      value="{{ request.args.get('q') or '' }}"
      hx-get="/contacts"
      hx-trigger="search, keyup delay:200ms changed"
      hx-target="tbody"
      hx-push-url="true"
      hx-indicator="#spinner"
      style="height: 2rem"
      _="on keydown[altKey and code is 'KeyS'] from the window halt the event's default then focus me">
    <img id="spinner" class="htmx-indicator"
      src="/static/img/spinning-circles.svg"
      alt="Request in flight..."
      style="height: 2rem">
    <input type="submit" value="Search">
  </form>

  <form x-data="{ selected: [] }">
    <template x-if="selected.length >0">
      <div class="box info tool-bar">
        <slot x-text="selected.length"></slot> contacts selected
        <button type="button" class="bad bg color border"
          @click="
          confirm(`Delete ${selected.length} contacts?`) &&
          htmx.ajax('DELETE', '/contacts', { source: $root, target: document.body })">
          Delete
        </button>
        <hr aria-orientation="vertical">
        <button type="button" @click="selected = []">Cancel</button>
      </div>
    </template>
    <table>
      <thead>
        <tr>
          <th></th><th>First</th><th>Last</th><th>Phone</th><th>Email</th>
        </tr>
      </thead>
      <tbody>
      {% include "rows.html" %}
      </tbody>
    </table>
  </form>
  

  <p>
    <a href="/contacts/new">Add Contact</a>
    <span hx-get="/contacts/count" hx-trigger="revealed">
      <img id="spinner" class="htmx-indicator" src="/static/img/spinning-circles.svg" style="height: 1rem">
    </span>
  </p>

{% endblock %}
