{% extends "layout.html" %}

{% block content %}

  <form action="/contacts" method="get" class="tool-bar">
    <label for="search">Search Term</label>
    <input id="search" type="search" name="q"
      value="{{ request.args.get('q') or '' }}"
      hx-get="/contacts"
      hx-trigger="search, keyup delay:200ms changed"
      hx-target="tbody"
      hx-push-url="true"
      hx-indicator="#spinner"
      style="height: 2rem">
    <img id="spinner" class="htmx-indicator"
      src="/static/img/spinning-circles.svg"
      alt="Request in flight..."
      style="height: 2rem">
    <input type="submit" value="Search">
  </form>

  <table>
    <thead>
      <tr>
        <th>First <th>Last <th>Phone <th>Email </th>
      </tr>
    </thead>
    <tbody>
    {% include "rows.html" %}
    </tbody>
  </table>

  <p>
    <a href="/contacts/new">Add Contact</a>
    <span hx-get="/contacts/count" hx-trigger="revealed">
      <img id="spinner" class="htmx-indicator" src="/static/img/spinning-circles.svg" style="height: 1rem">
    </span>
  </p>

{% endblock %}
